[project]
name = "menu-calendario-mcp"
version = "0.1.0"
description = "Local MCP server for macOS Calendar and Finder automation"
readme = "README.md"
authors = [
    { name = "ibaiceberio", email = "ibai.ceberio@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.26.0",
    "pyobjc-core>=11.1; sys_platform == 'darwin'",
    "pyobjc-framework-EventKit>=11.1; sys_platform == 'darwin'",
]

[project.scripts]
menu-calendario-mcp = "menu_calendario_mcp:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
